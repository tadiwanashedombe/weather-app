<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WeatherWizard</title>
    <meta name="description" content="Weather forecast and current weather conditions ">
    <meta name="author" content="Tadiwanashe Sean Dombe">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link href="styles/index-large.css" rel="stylesheet">
    <link href="styles/index.css" rel="stylesheet">
    <script src="scripts/index.js" defer></script>

</head>

<body>
    <header>
        <h1 id="cityName"></h1>
        <form id="city-search" class="city-search" role="search" autocomplete="off">
            <span class="search">
            <label class="visually-hidden" for="city-input">
                <img src="images/search.svg" alt="Search icon" width="20" height="20">
            </label>
                <input id="city-input" type="search" placeholder="Enter a city" autocomplete="off" required>
            </span>
            <button id="search-button" type="submit"></button>
        </form>
    </header>
    <p id="weather-error" class="weather-error" role="alert" hidden></p>
    <p id="weather-status" class="weather-status" role="status" aria-live="polite"></p>
    <main>
        <section class="weather">
            <div class="card">
                <h2 class="date">Today</h2>
                <div class="summary">
                    <figure class="figure">
                        <div id="condition">
                            <span id="description">
                            </span>
                            <span id="temperature"></span>
                        </div>
                        
                    </figure>

                </div>

                <div class="details">

                    <p><strong>Feels like: </strong><span id="feels-like"></span></p>

                    <p><strong>Humidity: </strong><span id="humidity"></span></p>

                    <p><strong>Pressure: </strong><span id="pressure"></span></p>

                    <p><strong>UV: </strong><span id="uv"></span></p>

                    <p><strong>Wind Speed: </strong><span id="wind"></span></p>

                    <p><strong>Wind Chill: </strong><span id="windchill"></span></p>

                </div>
            </div>
        </section>

        <section class="forecast-panel" aria-labelledby="forecast-heading">
            <h3 id="forecast-heading">3-Day Forecast</h3>
            <div id="forecast" class="forecast" aria-live="polite"></div>
        </section>
    </main>
    <footer>
        <p>©️<span id="currentyear"></span> WeatherWizard</p>
    </footer>
</body>

</html>
